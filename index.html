<script>
/* =====================================================================
   KONFIGURASI FIREBASE — ISI DENGAN NILAI DARI FIREBASE CONSOLE ANDA

  storageBucket: "workflow-1602d.firebasestorage.app",
  messagingSenderId: "389695059216",
  appId: "1:389695059216:web:0c549644631d853529e195",

/* =====================================================================
   KONFIGURASI CLOUDINARY — untuk upload & simpan GAMBAR (gratis, tanpa kartu kredit)
   1) Daftar gratis di https://cloudinary.com/users/register/free
   2) Setelah login, di Dashboard akan terlihat "Cloud name" Anda di bagian atas
      → salin nilainya ke cloudName di bawah ini
   3) Buat Upload Preset (supaya browser bisa upload langsung tanpa backend/API secret):
      - Buka Settings (ikon gear) > tab "Upload"
      - Scroll ke "Upload presets" > klik "Add upload preset"
      - Ubah "Signing Mode" dari "Signed" menjadi "Unsigned"
      - (Opsional) beri nama preset yang mudah diingat, misal "tenx_unsigned"
      - Klik "Save"
      - Salin nama preset itu ke uploadPreset di bawah ini
   ===================================================================== */
const cloudinaryConfig = {
  cloudName: "ro4ydiuo",
  uploadPreset: "tenx_unsigned"
};

const CONFIG_READY = !firebaseConfig.apiKey.startsWith('ISI_');
const CLOUDINARY_READY = !cloudinaryConfig.cloudName.startsWith('ISI_') && !cloudinaryConfig.uploadPreset.startsWith('ISI_');
let db = null;
if(CONFIG_READY){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* ===================== UPLOAD GAMBAR KE CLOUDINARY ===================== */
// Gambar TIDAK disimpan sebagai base64 di dalam dokumen Firestore (gampang
// kelebihan limit 1MB per field/dokumen). Sebagai gantinya file asli diupload ke
// Cloudinary lewat "unsigned upload" langsung dari browser (tanpa backend/API
// secret), lalu yang disimpan di Firestore hanya URL-nya (string pendek).
//
// Sebelum diupload, gambar dikompres & diresize dulu di browser (max 1600px sisi
// terpanjang, kualitas ~75%). Ini penting terutama untuk foto dari HP yang biasanya
// 3-12MB — tanpa kompresi, upload di jaringan mobile bisa sangat lambat / gantung.
function compressImage(file, maxDim=1600, quality=0.75){
  return new Promise((resolve)=>{
    // Kalau bukan gambar (jarang terjadi karena accept="image/*"), lewati kompresi.
    if(!file.type || !file.type.startsWith('image/')){ resolve(file); return; }
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let {width, height} = img;
      if(width > maxDim || height > maxDim){
        if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else { width = Math.round(width * (maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob=>{
        if(!blob){ resolve(file); return; } // gagal kompres → upload file asli saja
        const newName = file.name.replace(/\.(heic|heif|png|webp)$/i, '.jpg');
        resolve(new File([blob], /\.jpg$/i.test(newName) ? newName : newName + '.jpg', {type:'image/jpeg'}));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); }; // gagal decode → upload asli
    img.src = objectUrl;
  });
}

// Upload satu file ke Cloudinary pakai XMLHttpRequest (bukan fetch) supaya bisa
// melacak progress upload byte-per-byte secara real-time lewat xhr.upload.onprogress.
function uploadOneFile(file, folder, onBytesProgress){
  return new Promise((resolve, reject)=>{
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', cloudinaryConfig.uploadPreset);
    formData.append('folder', folder);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`);
    xhr.timeout = 45000;

    xhr.upload.onprogress = (e) => {
      if(e.lengthComputable && onBytesProgress) onBytesProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      let data = null;
      try{ data = JSON.parse(xhr.responseText); }catch(e){ /* respons bukan JSON */ }
      if(xhr.status >= 200 && xhr.status < 300 && data && data.secure_url){
        resolve(data.secure_url);
      } else {
        const msg = data?.error?.message || `Upload gagal (status ${xhr.status}). Cek nama Cloud Name / Upload Preset sudah benar dan bermode Unsigned.`;
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('Gagal terhubung ke Cloudinary (cek koneksi internet, atau kemungkinan diblokir extension/adblocker/firewall).'));
    xhr.ontimeout = () => reject(new Error('Upload terlalu lama / macet (koneksi sangat lambat, atau server Cloudinary tidak merespons).'));
    xhr.send(formData);
  });
}

// Upload beberapa file sekaligus (paralel), masing-masing dikompres dulu, ke Cloudinary.
// onProgress(percent, doneCount, totalCount) dipanggil berkali-kali selama upload berjalan,
// dengan percent = persentase gabungan dari semua file (0-100), untuk update UI real-time.
async function uploadFilesToStorage(files, folder, onProgress){
  if(!CLOUDINARY_READY) throw new Error('Cloudinary belum dikonfigurasi. Isi cloudName & uploadPreset di bagian atas kode.');
  const total = files.length;
  let done = 0;
  const loadedBytes = new Array(total).fill(0);
  const totalBytes = new Array(total).fill(1); // default 1 supaya tidak dibagi 0 sebelum ada info ukuran asli
  const reportProgress = () => {
    if(!onProgress) return;
    const sumLoaded = loadedBytes.reduce((a,b)=>a+b,0);
    const sumTotal = totalBytes.reduce((a,b)=>a+b,0);
    const pct = sumTotal ? Math.min(99, Math.round((sumLoaded/sumTotal)*100)) : 0;
    onProgress(pct, done, total);
  };
  const uploadOne = async (idx, f) => {
    const compressed = await compressImage(f);
    totalBytes[idx] = compressed.size || 1;
    const url = await uploadOneFile(compressed, folder, (loaded, totalB)=>{
      loadedBytes[idx] = loaded;
      totalBytes[idx] = totalB;
      reportProgress();
    });
    done++;
    reportProgress();
    return url;
  };
  // Batasi maksimal 3 upload berjalan bersamaan agar tidak membebani koneksi mobile.
  const results = new Array(files.length);
  let cursor = 0;
  async function worker(){
    while(cursor < files.length){
      const idx = cursor++;
      results[idx] = await uploadOne(idx, files[idx]);
    }
  }
  const workers = Array.from({length: Math.min(3, files.length)}, worker);
  await Promise.all(workers);
  if(onProgress) onProgress(100, total, total);
  return results;
}

/* ===================== HELPERS ===================== */
function fmtDate(iso_or_ts){
  if(!iso_or_ts) return '-';
  const d = new Date(iso_or_ts);
  if(isNaN(d)) return '-';
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function rupiah(n){
  return 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID');
}
function totalQty(p){ return (p.ukuran||[]).reduce((s,u)=>s+(parseInt(u.qty)||0),0); }
function totalKomisi(p){ return totalQty(p) * (parseFloat(p.komisiPerPcs)||0); }
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function escapeHtml(str){
  if(!str) return '';
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}
function distinctNames(field){
  const set = new Set();
  projectsCache.forEach(p=>{ if(p[field]) set.add(p[field]); });
  return Array.from(set);
}

/* ===================== GROUPING: PER BULAN, DIPISAH PER TAHUN ===================== */
// Dipakai di list yang berpotensi panjang (Daftar Project & Riwayat) supaya rapi
// dan tidak berantakan saat sudah lintas bulan/tahun.
const MONTH_NAMES_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function groupByMonthYear(list, dateField='createdAt'){
  const map = {};
  list.forEach(p=>{
    const ts = p[dateField] || p.createdAt;
    const d = new Date(ts);
    const valid = !isNaN(d);
    const y = valid ? d.getFullYear() : 0;
    const m = valid ? d.getMonth() : 0;
    const key = y + '-' + m;
    if(!map[key]) map[key] = {year:y, month:m, items:[]};
    map[key].items.push(p);
  });
  return Object.values(map).sort((a,b)=> b.year-a.year || b.month-a.month);
}

function renderGroupedGrid(list, dateField='createdAt'){
  if(!list.length) return '';
  const groups = groupByMonthYear(list, dateField);
  let html = '';
  let lastYear = null;
  groups.forEach(g=>{
    if(g.year !== lastYear){
      html += `<div class="year-divider mono">${g.year || 'Tanpa Tanggal'}</div>`;
      lastYear = g.year;
    }
    html += `
      <div class="month-title">
        <h4>${MONTH_NAMES_ID[g.month]}</h4>
        <div class="mline"></div>
        <span class="cnt">${g.items.length} project</span>
      </div>
      <div class="grid">${g.items.map(p=>projectCard(p)).join('')}</div>
    `;
  });
  return html;
}

function renderRekapKomisi(){
  const map = {};
  projectsCache.forEach(p=>{
    const name = (p.namaProduksi||'').trim();
    if(!name) return;
    if(!map[name]) map[name] = {name, jumlahSelesai:0, pcsSelesai:0, komisiFinal:0, jumlahBerjalan:0, pcsBerjalan:0, komisiBerjalan:0};
    const qty = totalQty(p), kom = totalKomisi(p);
    if(p.status==='selesai'){
      map[name].jumlahSelesai++; map[name].pcsSelesai+=qty; map[name].komisiFinal+=kom;
    } else if(p.status==='desain_selesai' || p.status==='diproses_produksi'){
      map[name].jumlahBerjalan++; map[name].pcsBerjalan+=qty; map[name].komisiBerjalan+=kom;
    }
  });
  const rows = Object.values(map).sort((a,b)=>b.komisiFinal-a.komisiFinal);
  const grandFinal = rows.reduce((s,r)=>s+r.komisiFinal,0);
  const grandBerjalan = rows.reduce((s,r)=>s+r.komisiBerjalan,0);

  if(!rows.length){
    return emptyState('Belum ada data komisi','Rekap akan muncul otomatis setelah project ditugaskan ke bagian Produksi.');
  }

  return `
    <div class="section-title"><h2>Rekap Komisi per Bagian Produksi</h2><div class="line"></div></div>
    <div style="overflow-x:auto;">
    <table class="rekap">
      <thead><tr>
        <th>Nama Produksi</th><th>Project Selesai</th><th>Pcs Selesai</th><th>Komisi Final</th>
        <th>Project Berjalan</th><th>Pcs Berjalan</th><th>Komisi Berjalan (estimasi)</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td><b>${escapeHtml(r.name)}</b></td>
            <td>${r.jumlahSelesai}</td>
            <td>${r.pcsSelesai}</td>
            <td class="mono">${rupiah(r.komisiFinal)}</td>
            <td>${r.jumlahBerjalan}</td>
            <td>${r.pcsBerjalan}</td>
            <td class="mono">${rupiah(r.komisiBerjalan)}</td>
          </tr>
        `).join('')}
      </tbody>
      <tfoot>
        <tr><td colspan="3">TOTAL</td><td class="mono">${rupiah(grandFinal)}</td><td colspan="2"></td><td class="mono">${rupiah(grandBerjalan)}</td></tr>
      </tfoot>
    </table>
    </div>
    <div class="note-box" style="margin-top:16px;">Komisi Final dihitung dari project berstatus <b>Selesai</b>. Komisi Berjalan adalah estimasi dari project yang sudah masuk tahap Desain Selesai / Diproses Produksi namun belum ditandai Selesai.</div>
  `;
}

async function handleRefUpload(e){
  const files = Array.from(e.target.files);
  if(!files.length) return;

  const statusEl = document.getElementById('refUploadStatus');
  input.disabled = true;
  statusEl.textContent = `Mengupload… 0%`;
  try{
    const urls = await uploadFilesToStorage(files, `referensi/${tempRefUploadId}`, (pct,done,total)=>{
      statusEl.textContent = total>1 ? `Mengupload ${done}/${total} — ${pct}%` : `Mengupload… ${pct}%`;
    });
    tempRefImgs.push(...urls);
    statusEl.textContent = '';
  }catch(err){
    console.error('Gagal upload gambar', err);
    statusEl.textContent = '';
    alert('Gagal upload gambar: ' + err.message);
  }
  input.disabled = false;
  renderRefPreview();
  input.value = '';
}
function renderRefPreview(){
  document.getElementById('refPreview').innerHTML = tempRefImgs.map((src,i)=>`
    <div class="ip"><img src="${src}" onclick="openLightbox(this.src)"><button class="rm" onclick="removeRefImg(${i})">×</button></div>
  `).join('');
}
function removeRefImg(i){ tempRefImgs.splice(i,1); renderRefPreview(); }

async function submitNewProject(){
  const nama = document.getElementById('f_nama').value.trim();
  const hp = document.getElementById('f_hp').value.trim();
  const via = document.getElementById('f_via').value;
  const brief = document.getElementById('f_brief').value.trim();
  const namaDesainer = document.getElementById('f_desainer').value.trim();
  const namaProduksi = document.getElementById('f_produksi').value.trim();
  const komisiPerPcs = parseFloat(document.getElementById('f_komisi').value) || 0;

  if(!nama || !hp || !brief){
    alert('Mohon lengkapi Nama Client, No. HP, dan Brief Desain.');
    return;
  }
  const ukuranClean = tempUkuran.filter(u=>u.ukuran.trim()!=='');

  const project = {
    id: genId(),
    namaKlien: nama, noHp: hp, via: via, briefDesain: brief,
    ukuran: ukuranClean, referensi: tempRefImgs,
    namaDesainer, namaProduksi, komisiPerPcs,
    status: 'baru', createdAt: Date.now(),
    desainMulai:null, pedomanDesain:'', pedomanGambar:[], listDesain:'', deadline:'',
    produksiMulai:null, selesaiAt:null
  };
  const ok = await saveProject(project);
  if(!ok) return;
  closeModal();
  await refresh();
}

/* ===================== MODAL: DETAIL ===================== */
let tempPedomanImgs = [];

function openDetailModal(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;

  const ukuranHtml = (p.ukuran||[]).map(u=>`<span class="mono" style="display:inline-block;background:var(--canvas-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;margin:0 6px 6px 0;font-size:12.5px;">${escapeHtml(u.ukuran)} × ${u.qty}</span>`).join('') || '<span style="color:var(--ink-soft);">Belum diisi</span>';
  const refHtml = (p.referensi||[]).map(src=>`<img src="${src}" onclick="openLightbox(this.src)" style="width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--line);margin:0 6px 6px 0;cursor:pointer;">`).join('') || '<span style="color:var(--ink-soft);">Tidak ada gambar</span>';

  let body = `
    <div class="kv"><b>No. HP</b><span>${p.noHp}</span></div>
    <div class="kv"><b>Via</b><span>${escapeHtml(p.via)}</span></div>
    <div class="kv"><b>Masuk</b><span>${fmtDate(p.createdAt)}</span></div>
    <div class="kv"><b>Desainer</b><span>${escapeHtml(p.namaDesainer||'-')}</span></div>
    <div class="kv"><b>Produksi</b><span>${escapeHtml(p.namaProduksi||'-')}</span></div>
    <div class="kv"><b>Brief</b><span>${escapeHtml(p.briefDesain)}</span></div>
    <div class="kv"><b>List Ukuran</b><div>${ukuranHtml}</div></div>
    <div class="kv"><b>Referensi</b><div>${refHtml}</div></div>
  `;

  // desainer section
  if(p.status === 'baru'){
    body += `<div class="note-box">Project ini belum mulai dikerjakan Desainer.</div>`;
    if(state.role==='desainer' && sameName(p.namaDesainer)){
      body += `<div class="modal-actions"><button class="btn block" onclick="startDesain('${p.id}')">Mulai Desain</button></div>`;
    }
  } else {
    const pedomanImgsHtml = (p.pedomanGambar||[]).map(src=>`<img src="${src}" onclick="openLightbox(this.src)" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin:0 6px 6px 0;cursor:pointer;">`).join('');
    body += `
      <div class="divider"></div>
      <h2 style="font-size:19px;">Pedoman Desain</h2>
      <div class="kv"><b>Mulai Desain</b><span>${fmtDate(p.desainMulai)}</span></div>
      <div class="kv"><b>Pedoman</b><span>${p.pedomanDesain ? escapeHtml(p.pedomanDesain) : '<i style="color:var(--ink-soft);">Belum diisi</i>'}</span></div>
      <div class="kv"><b>List Desain</b><span>${p.listDesain ? escapeHtml(p.listDesain) : '<i style="color:var(--ink-soft);">Belum diisi</i>'}</span></div>
      <div class="kv"><b>Deadline</b><span>${p.deadline ? fmtDate(p.deadline) : '<i style="color:var(--ink-soft);">Belum diisi</i>'}</span></div>
      ${pedomanImgsHtml ? `<div class="kv"><b>Gambar Pedoman</b><div>${pedomanImgsHtml}</div></div>` : ''}
    `;
    if(state.role==='desainer' && p.status==='diproses_desainer' && sameName(p.namaDesainer)){
      tempPedomanImgs = [...(p.pedomanGambar||[])];
      body += `
        <div class="divider"></div>
        <h2 style="font-size:19px;">Isi Pedoman Desain</h2>
        <label>Pedoman Desain</label>
        <textarea id="f_pedoman" placeholder="Arahan desain: font, warna, layout, teknik sablon/bordir, dsb.">${escapeHtml(p.pedomanDesain||'')}</textarea>
        <label>List Desain</label>
        <textarea id="f_listdesain" placeholder="cth: Desain Depan, Desain Belakang, Logo Lengan">${escapeHtml(p.listDesain||'')}</textarea>
        <label>Deadline</label>
        <input type="date" id="f_deadline" value="${p.deadline||''}">
        <label>Upload Gambar Pedoman (opsional)</label>
        <input type="file" id="f_pedomanimg" accept="image/*" multiple onchange="handlePedomanUpload(event, '${p.id}')">
        <div class="upload-status mono" id="pedomanUploadStatus"></div>
        <div class="img-preview-strip" id="pedomanPreview"></div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="saveDesainerDraft('${p.id}')">Simpan Draft</button>
          <button class="btn green" onclick="finishDesain('${p.id}')">Tandai Desain Selesai</button>
        </div>
      `;
    }
  }

  // komisi box (visible once komisi set)
  if(p.komisiPerPcs){
    body += `
      <div class="komisi-box">
        <div class="lbl">Total Pcs ${totalQty(p)} × ${rupiah(p.komisiPerPcs)}/pcs</div>
        <div class="big">${rupiah(totalKomisi(p))}</div>
      </div>
    `;
  }

  // produksi actions
  if(state.role==='produksi' && sameName(p.namaProduksi)){
    if(p.status==='desain_selesai'){
      body += `<div class="modal-actions"><button class="btn rust block" onclick="startProduksi('${p.id}')">Mulai Produksi</button></div>`;
    } else if(p.status==='diproses_produksi'){
      body += `<div class="modal-actions"><button class="btn green block" onclick="finishProduksi('${p.id}')">Tandai Produksi Selesai</button></div>`;
    }
  }

  // admin manual override + edit/hapus
  if(state.role==='admin'){
    body += `
      <div class="divider"></div>
      <label>Ubah Status Manual (Admin)</label>
      <div style="display:flex;gap:8px;">
        <select id="f_manualstatus" style="flex:1;">
          ${Object.keys(STATUS_LABEL).map(k=>`<option value="${k}" ${p.status===k?'selected':''}>${STATUS_LABEL[k]}</option>`).join('')}
        </select>
        <button class="btn ghost" onclick="manualSetStatus('${p.id}')">Terapkan</button>
      </div>

      <div class="divider"></div>
      <label>Kelola Project (Admin)</label>
      <div class="modal-actions" style="margin-top:0;">
        <button class="btn ghost" onclick="openEditProjectModal('${p.id}')">✎ Edit Project</button>
        <button class="btn rust" onclick="deleteProject('${p.id}')">🗑 Hapus Project</button>
      </div>
    `;
  }

  renderModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>${escapeHtml(p.namaKlien)}</h2>
    <div class="modal-sub mono">${p.id} · <span class="badge ${p.status}" style="transform:none;">${STATUS_LABEL[p.status]}</span></div>
    ${body}
  `);

  if(state.role==='desainer' && p.status==='diproses_desainer'){ renderPedomanPreview(); }
}

function sameName(field){
  return (field||'').trim().toLowerCase() === (state.myName||'').trim().toLowerCase();
}

async function handlePedomanUpload(e, projectId){
  const files = Array.from(e.target.files);
  if(!files.length) return;
  const input = e.target;
  const statusEl = document.getElementById('pedomanUploadStatus');
  input.disabled = true;
  if(statusEl) statusEl.textContent = `Mengupload… 0%`;
  try{
    const urls = await uploadFilesToStorage(files, `pedoman/${projectId}`, (pct,done,total)=>{
      if(statusEl) statusEl.textContent = total>1 ? `Mengupload ${done}/${total} — ${pct}%` : `Mengupload… ${pct}%`;
    });
    tempPedomanImgs.push(...urls);
    if(statusEl) statusEl.textContent = '';
  }catch(err){
    console.error('Gagal upload gambar', err);
    if(statusEl) statusEl.textContent = '';
    alert('Gagal upload gambar: ' + err.message);
  }
  input.disabled = false;
  renderPedomanPreview();
  input.value = '';
}
function renderPedomanPreview(){
  const el = document.getElementById('pedomanPreview');
  if(!el) return;
  el.innerHTML = tempPedomanImgs.map((src,i)=>`
    <div class="ip"><img src="${src}" onclick="openLightbox(this.src)"><button class="rm" onclick="removePedomanImg(${i})">×</button></div>
  `).join('');
}
function removePedomanImg(i){ tempPedomanImgs.splice(i,1); renderPedomanPreview(); }

async function startDesain(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  p.status = 'diproses_desainer';
  p.desainMulai = Date.now();
  const ok = await saveProject(p);
  if(!ok) return;
  await refresh(false);
  openDetailModal(id);
  render();
}

async function saveDesainerDraft(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  p.pedomanDesain = document.getElementById('f_pedoman').value.trim();
  p.listDesain = document.getElementById('f_listdesain').value.trim();
  p.deadline = document.getElementById('f_deadline').value;
  p.pedomanGambar = [...tempPedomanImgs];
  const ok = await saveProject(p);
  if(!ok) return;
  closeModal();
  await refresh();
}

async function finishDesain(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  const pedoman = document.getElementById('f_pedoman').value.trim();
  const deadline = document.getElementById('f_deadline').value;
  if(!pedoman || !deadline){
    alert('Isi minimal Pedoman Desain dan Deadline sebelum menandai selesai.');
    return;
  }
  p.pedomanDesain = pedoman;
  p.listDesain = document.getElementById('f_listdesain').value.trim();
  p.deadline = deadline;
  p.pedomanGambar = [...tempPedomanImgs];
  p.status = 'desain_selesai';
  const ok = await saveProject(p);
  if(!ok) return;
  closeModal();
  await refresh();
}

async function startProduksi(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  p.status = 'diproses_produksi';
  p.produksiMulai = Date.now();
  const ok = await saveProject(p);
  if(!ok) return;
  closeModal();
  await refresh();
}
async function finishProduksi(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  p.status = 'selesai';
  p.selesaiAt = Date.now();
  const ok = await saveProject(p);
  if(!ok) return;
  closeModal();
  await refresh();
}
async function manualSetStatus(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  p.status = document.getElementById('f_manualstatus').value;
  const ok = await saveProject(p);
  if(!ok) return;
  closeModal();
  await refresh();
}

/* ===================== HAPUS PROJECT (ADMIN) ===================== */
async function deleteProject(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;
  const yakin = confirm(`Yakin ingin menghapus project "${p.namaKlien}" (${p.id})?\n\nData yang sudah dihapus TIDAK BISA dikembalikan.`);
  if(!yakin) return;
  try{
    await db.collection('projects').doc(id).delete();
    closeModal();
    await refresh();
  }catch(e){
    console.error('Gagal menghapus project', e);
    alert('Gagal menghapus project: ' + e.message);
  }
}

/* ===================== EDIT PROJECT (ADMIN) ===================== */
function openEditProjectModal(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;

  tempUkuran = (p.ukuran && p.ukuran.length) ? p.ukuran.map(u=>({...u})) : [{ukuran:'', qty:1}];
  tempRefImgs = [...(p.referensi||[])];
  tempRefUploadId = p.id;

  const desainerDl = distinctNames('namaDesainer').map(n=>`<option value="${escapeHtml(n)}">`).join('');
  const produksiDl = distinctNames('namaProduksi').map(n=>`<option value="${escapeHtml(n)}">`).join('');
  const viaOptions = ['WhatsApp','Telepon','Datang Langsung','Instagram / Sosial Media','Lainnya'];

  renderModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>Edit Project</h2>
    <div class="modal-sub mono">${p.id}</div>

    <label>Nama Client</label>
    <input type="text" id="f_nama" value="${escapeHtml(p.namaKlien||'')}">

    <div class="row2">
      <div>
        <label>No. HP / WA</label>
        <input type="tel" id="f_hp" value="${escapeHtml(p.noHp||'')}">
      </div>
      <div>
        <label>Via Masuk</label>
        <select id="f_via">
          ${viaOptions.map(v=>`<option ${p.via===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
    </div>

    <label>Brief Desain</label>
    <textarea id="f_brief">${escapeHtml(p.briefDesain||'')}</textarea>

    <label>List Ukuran & Qty</label>
    <div id="ukuranWrap"></div>
    <button type="button" class="btn ghost small" onclick="addUkuranRow()">+ Tambah Ukuran</button>

    <label>Gambar Referensi dari Client</label>
    <input type="file" id="f_ref" accept="image/*" multiple onchange="handleRefUpload(event)">
    <div class="filehint">Upload gambar baru untuk menambah. Klik × pada gambar untuk menghapusnya.</div>
    <div class="upload-status mono" id="refUploadStatus"></div>
    <div class="img-preview-strip" id="refPreview"></div>

    <div class="divider"></div>
    <div class="section-title" style="margin:0 0 4px;"><h2 style="font-size:18px;">Penugasan & Komisi</h2><div class="line"></div></div>

    <div class="row2">
      <div>
        <label>Nama Desainer (Ditugaskan)</label>
        <input type="text" id="f_desainer" list="dl_desainer" value="${escapeHtml(p.namaDesainer||'')}">
        <datalist id="dl_desainer">${desainerDl}</datalist>
      </div>
      <div>
        <label>Nama Bagian Produksi (Ditugaskan)</label>
        <input type="text" id="f_produksi" list="dl_produksi" value="${escapeHtml(p.namaProduksi||'')}">
        <datalist id="dl_produksi">${produksiDl}</datalist>
      </div>
    </div>
    <label>Komisi Produksi per Pcs (Rp)</label>
    <input type="number" min="0" id="f_komisi" value="${p.komisiPerPcs||0}">
    <div class="filehint">Total komisi akan dihitung otomatis: Komisi per Pcs × Total Pcs.</div>

    <div class="modal-actions">
      <button class="btn ghost" onclick="openDetailModal('${p.id}')">Batal</button>
      <button class="btn block" onclick="submitEditProject('${p.id}')">Simpan Perubahan</button>
    </div>
  `);
  renderUkuranRows();
  renderRefPreview();
}

async function submitEditProject(id){
  const p = projectsCache.find(x=>x.id===id);
  if(!p) return;

  const nama = document.getElementById('f_nama').value.trim();
  const hp = document.getElementById('f_hp').value.trim();
  const via = document.getElementById('f_via').value;
  const brief = document.getElementById('f_brief').value.trim();
  const namaDesainer = document.getElementById('f_desainer').value.trim();
  const namaProduksi = document.getElementById('f_produksi').value.trim();
  const komisiPerPcs = parseFloat(document.getElementById('f_komisi').value) || 0;

  if(!nama || !hp || !brief){
    alert('Mohon lengkapi Nama Client, No. HP, dan Brief Desain.');
    return;
  }
  const ukuranClean = tempUkuran.filter(u=>u.ukuran.trim()!=='');

  const updated = {
    ...p,
    namaKlien: nama, noHp: hp, via: via, briefDesain: brief,
    ukuran: ukuranClean, referensi: tempRefImgs,
    namaDesainer, namaProduksi, komisiPerPcs
  };

  const ok = await saveProject(updated);
  if(!ok) return;
  closeModal();
  await refresh();
}

/* ===================== MODAL SHELL ===================== */
function renderModal(innerHtml){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">${innerHtml}</div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ===================== LIGHTBOX (lihat gambar full-size sekali klik) ===================== */
function openLightbox(src){
  document.getElementById('lightboxRoot').innerHTML = `
    <div class="lightbox-overlay" onclick="closeLightbox()">
      <button class="lightbox-close" onclick="closeLightbox()">×</button>
      <img src="${src}" onclick="event.stopPropagation()">
    </div>
  `;
}
function closeLightbox(){ document.getElementById('lightboxRoot').innerHTML = ''; }

/* ===================== INIT ===================== */
(function init(){
  if(!CONFIG_READY){ state.loading = false; render(); return; }
  render(); // tampilkan loading dulu
  subscribeRealtime(); // begitu snapshot pertama datang, render() dipanggil ulang otomatis
})();
</script>
</body>
</html>
